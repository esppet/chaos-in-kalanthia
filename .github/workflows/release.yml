name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache AGS Editor
        uses: actions/cache@v4
        id: ags-cache
        with:
          path: ags
          key: ags-editor-3.6.3.10

      - name: Download AGS Editor
        if: steps.ags-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/adventuregamestudio/ags/releases/download/v3.6.3.10/AGS-3.6.3.10-Beta10.zip"
          Invoke-WebRequest -Uri $url -OutFile ags.zip
          Expand-Archive -Path ags.zip -DestinationPath ags -Force

      - name: Build game
        timeout-minutes: 30
        shell: cmd
        run: |
          set "GAME=%GITHUB_WORKSPACE%\game\Game.agf"
          set "EDITOR=%GITHUB_WORKSPACE%\ags\AGSEditor.exe"
          echo Building %GAME%
          "%EDITOR%" /compile "%GAME%"
          if errorlevel 1 exit /b 1
          echo === Compiled output ===
          if exist "%GITHUB_WORKSPACE%\game\Compiled" (
            dir /s "%GITHUB_WORKSPACE%\game\Compiled"
          ) else (
            echo No Compiled folder found under game\
            exit /b 1
          )

      - name: Locate build output
        id: paths
        shell: pwsh
        run: |
          $candidates = @(
            "${{ github.workspace }}\game\Compiled",
            "${{ github.workspace }}\ags\Compiled"
          )
          $compiled = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $compiled = $c; break }
          }
          if (-not $compiled) { Write-Error "No Compiled folder found" }

          $windows = Join-Path $compiled "Windows"
          $data = Join-Path $compiled "Data"
          if (Test-Path $windows) {
            echo "bundle=$windows" >> $env:GITHUB_OUTPUT
            echo "type=windows" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path $data) {
            echo "bundle=$data" >> $env:GITHUB_OUTPUT
            echo "type=data" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Compiled folder has no Windows or Data subfolder: $compiled"
          }

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = "dist/chaos-in-kalanthia-${version}-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          if ("${{ steps.paths.outputs.type }}" -eq "windows") {
            Copy-Item -Recurse "${{ steps.paths.outputs.bundle }}\*" $out/
          } else {
            Copy-Item -Recurse "${{ steps.paths.outputs.bundle }}\*" $out/
            Copy-Item "${{ github.workspace }}\ags\acwin.exe" "$out\chaos-in-kalanthia.exe"
          }

          python "${{ github.workspace }}\scripts\patch-ags-scummvm.py" $out
          Compress-Archive -Path $out -DestinationPath "dist/chaos-in-kalanthia-${version}-windows.zip" -Force

      - name: Package Linux runtime bundle
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = "dist/chaos-in-kalanthia-${version}-linux"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $linuxCompiled = "${{ github.workspace }}\game\Compiled\Linux"
          if (Test-Path $linuxCompiled) {
            Copy-Item -Recurse "$linuxCompiled\*" $out/
          } else {
            if ("${{ steps.paths.outputs.type }}" -eq "windows") {
              Copy-Item -Recurse "${{ steps.paths.outputs.bundle }}\*" $out/
            } else {
              Copy-Item -Recurse "${{ steps.paths.outputs.bundle }}\*" $out/
            }
            Copy-Item "${{ github.workspace }}\ags\Linux\ags64" $out\
            Copy-Item -Recurse "${{ github.workspace }}\ags\Linux\lib64" $out\
          }

          python "${{ github.workspace }}\scripts\patch-ags-scummvm.py" $out
          tar -czf "dist/chaos-in-kalanthia-${version}-linux.tar.gz" -C dist "chaos-in-kalanthia-${version}-linux"

      - name: Package source
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path game -DestinationPath "dist/chaos-in-kalanthia-${version}-source.zip" -Force

      - name: Remove stale draft releases for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}"
          gh release list --repo "${{ github.repository }}" --limit 20 --json tagName,isDraft,id \
            --jq ".[] | select(.tagName == \"$TAG\" and .isDraft) | .id" \
            | while read -r id; do
                echo "Deleting draft release $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
              done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: Chaos in Kalanthia v${{ steps.version.outputs.version }}
          body: |
            ## Chaos in Kalanthia v${{ steps.version.outputs.version }}

            Blade Runner universe point-and-click adventure (AGS / ScummVM compatible).

            Release binaries are patched for **ScummVM 2.8+** compatibility (AGS data format 3060114).
            Standalone builds use the AGS 3.6.3 runtime bundled in the download.

            ### Downloads
            - **Windows** — `chaos-in-kalanthia-*-windows.zip`
            - **Linux** — `chaos-in-kalanthia-*-linux.tar.gz`
            - **Source** — `chaos-in-kalanthia-*-source.zip` (open in AGS Editor)

            ### Run
            - **Windows:** extract zip, run `chaos-in-kalanthia.exe`
            - **Linux:** extract tar.gz, run `./ags64 --path .`
            - **ScummVM:** add the game folder — ScummVM detects AGS games automatically
          files: dist/*
          draft: false
          prerelease: true